# Pulls live Japan jobs into the production database every 6 hours, closes
# postings that were taken down, and refreshes everyone's matches (which also
# sends new-match emails). Runs on GitHub's free runners -- no server needed.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> add the secrets
# below (same values as the backend's Vercel env vars). Run it once by hand
# from the Actions tab after the first deploy; that also applies migrations.

name: Ingest live jobs

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h, off the top of the hour when runners are busiest
  workflow_dispatch:
    inputs:
      board:
        description: "Only this board, e.g. lever:woven-by-toyota (blank = all)"
        required: false

concurrency:
  group: ingest-jobs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # Space LLM calls out to stay under free-tier per-minute limits.
      LLM_MIN_INTERVAL_SECONDS: "2.5"
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Ingest
        env:
          BOARD: ${{ github.event.inputs.board }}
        run: |
          if [ -n "$BOARD" ]; then
            python -m app.ingest --board "$BOARD"
          else
            python -m app.ingest
          fi
